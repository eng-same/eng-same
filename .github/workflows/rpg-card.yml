# GitHub's image proxy (camo) gives up after ~4s, and the RPG card worker is
# slower than that on a cold cache, so the card shows as a broken image when
# linked directly. This keeps a copy in the repo and refreshes it once a day.
name: Refresh RPG card

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch card
        run: |
          url="https://github-rpg-card.github-rpg-card.workers.dev/?username=${{ github.repository_owner }}&theme=dracula"
          curl -sSf --retry 3 --retry-delay 5 --max-time 60 "$url" -o /tmp/card.svg
          # Only accept a real SVG; on any failure keep the last good copy.
          head -c 5 /tmp/card.svg | grep -q '<svg' || { echo "Not an SVG, keeping old card"; exit 0; }
          [ "$(wc -c < /tmp/card.svg)" -gt 2000 ] || { echo "Card too small, keeping old card"; exit 0; }
          mv /tmp/card.svg assets/rpg-card.svg

      - name: Commit if changed
        run: |
          git diff --quiet -- assets/rpg-card.svg && { echo "No change"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/rpg-card.svg
          git commit -m "Refresh RPG card"
          git push
